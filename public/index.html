<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Social Credit</title>
  <meta name="description" content="A satirical civic credit bureau. Rate your friends, scan faces into 3D, and live with the consequences.">
  <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/img/seal.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Comic+Neue:wght@400;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/three.module.js",
        "@mediapipe/tasks-vision": "/vendor/mediapipe/vision_bundle.mjs"
      }
    }
  </script>
  <link rel="modulepreload" href="/vendor/three/three.module.js">
</head>
<body data-tier="guest">
  <div class="site">
    <div id="decree" hidden></div>
    <header class="topbar">
      <a href="#/" class="brand" aria-label="Social Credit, home">
        <svg class="brand-seal" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="20" cy="20" r="14.5" fill="none" stroke="currentColor" stroke-width="0.6" stroke-dasharray="1.2 1.6"/>
          <path d="M20 9.5l2.6 6.4 6.9.4-5.3 4.4 1.7 6.7L20 23.7l-5.9 3.7 1.7-6.7-5.3-4.4 6.9-.4z" fill="currentColor"/>
        </svg>
        <span class="brand-text">
          <span class="brand-name">Social <i>Credit</i></span>
          <span class="brand-sub">Bureau of Civic Standing</span>
        </span>
      </a>
      <nav class="topnav" aria-label="Main">
        <a href="#/" data-nav="home">Registry</a>
        <a href="#/handbook" data-nav="handbook">Handbook</a>
        <span id="nav-me"></span>
      </nav>
    </header>
    <div id="status-banner"></div>
    <main id="app"></main>
    <footer class="foot">
      <p>Social Credit · a satire. Everyone here chose to be rated. Be kind, mostly. · <a href="#/handbook">Handbook</a></p>
      <p>Faces are reconstructed on-device with MediaPipe and rendered with Three.js.</p>
    </footer>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <div id="throttle" hidden><div><div class="bar"><i></i></div><p></p></div></div>
  <svg id="eye" viewBox="0 0 64 40" hidden aria-label="You are being watched" role="img">
    <g class="lid">
      <path d="M2 20C12 6 52 6 62 20 52 34 12 34 2 20z" fill="#fffdf6" stroke="#141414" stroke-width="2"/>
      <g class="pupil"><circle cx="32" cy="20" r="9" fill="#2a2a2a"/><circle cx="32" cy="20" r="4" fill="#000"/><circle cx="35" cy="17" r="1.8" fill="#fff"/></g>
    </g>
  </svg>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
